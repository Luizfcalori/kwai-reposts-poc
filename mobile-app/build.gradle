plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luizcalori.kwaihelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luizcalori.kwaihelper'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
