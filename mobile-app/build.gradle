plugins {
    id 'com.android.application'
}

def stableKeystore = file('signing/kwai-helper.keystore')

android {
    namespace 'com.luizcalori.kwaihelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luizcalori.kwaihelper'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.4.0'
    }

    signingConfigs {
        stable {
            storeFile stableKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
