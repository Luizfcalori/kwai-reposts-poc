name: Build Kwai Phone Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-kwai-phone-helper.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon :mobile-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kwai-phone-helper-debug
          path: mobile-app/build/outputs/apk/debug/mobile-app-debug.apk
          if-no-files-found: error
          retention-days: 7
