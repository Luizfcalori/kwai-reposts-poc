name: Build Kwai Phone Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-kwai-phone-helper.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kwai-phone-helper-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon :mobile-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kwai-phone-helper-debug
          path: mobile-app/build/outputs/apk/debug/mobile-app-debug.apk
          if-no-files-found: error
          retention-days: 7
