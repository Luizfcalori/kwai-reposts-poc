name: Kwai login screen proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-login-screen-proof.yml'
      - 'scripts/kwai_ui_probe.py'

permissions:
  contents: read

jobs:
  login-screen-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare KVM and Kwai package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts apks
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          docker run --rm -v "$PWD/apks:/output" ghcr.io/efforg/apkeep:stable \
            -a com.kwai.video -d apk-pure \
            -o 'acknowledge_dangers=true,arch=x86_64;x86' /output \
            2>&1 | tee artifacts/download.txt

          find apks -maxdepth 1 -type f -printf '%f\t%s bytes\n' | tee artifacts/downloaded-files.txt
          test -n "$(find apks -maxdepth 1 -type f -print -quit)"

          cat > /tmp/install-and-probe.sh <<'SH'
          set -euo pipefail
          EXPECTED_CERT='bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047'
          mkdir -p artifacts/ui /tmp/kwai-package

          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do sleep 3; done

          BUNDLE="$(find apks -maxdepth 1 -type f | head -n1)"
          case "$BUNDLE" in
            *.xapk|*.zip) unzip -q "$BUNDLE" -d /tmp/kwai-package ;;
            *.apk) cp "$BUNDLE" /tmp/kwai-package/base.apk ;;
            *) echo "Unsupported package: $BUNDLE"; exit 1 ;;
          esac

          mapfile -d '' APKS < <(find /tmp/kwai-package -type f -name '*.apk' -print0)
          test "${#APKS[@]}" -gt 0

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          : > artifacts/verified-signers.txt
          for apk in "${APKS[@]}"; do
            CERT_OUTPUT="$($APKSIGNER verify --print-certs "$apk" 2>&1)"
            CERT="$(printf '%s\n' "$CERT_OUTPUT" \
              | sed -n -E 's/^(V[0-9.]+ Signer|Signer #[0-9]+): certificate SHA-256 digest: //p' \
              | sed -n '1p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            echo "$apk $CERT" | tee -a artifacts/verified-signers.txt
            test "$CERT" = "$EXPECTED_CERT"
          done

          adb install-multiple -r "${APKS[@]}" 2>&1 | tee artifacts/install.txt
          adb shell dumpsys package com.kwai.video \
            | grep -E 'versionName=|versionCode=|primaryCpuAbi=|secondaryCpuAbi=' \
            | head -n 20 | tee artifacts/installed-package.txt || true

          # Kwai asks for a second confirmation after tapping Skip on the
          # preparation/download screen. Patch the probe in the ephemeral
          # runner so the proof only continues after "Yes, skip" is accepted.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kwai_ui_probe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    time.sleep(7)\n    root, texts = dump(tag)\n    return root, texts, skipped\n'''
          new = '''    time.sleep(2)\n    root, texts = dump(tag + "-confirm")\n    if contains(texts, r"Skip the preparation|^Yes, skip$"):\n        confirmed = tap_node(root, lambda s: s.strip().lower() == "yes, skip")\n        if not confirmed:\n            adb("shell", "input", "tap", str(int(w*0.35)), str(int(h*0.62)))\n        time.sleep(7)\n    root, texts = dump(tag)\n    return root, texts, skipped\n'''
          if old not in s:
              raise SystemExit('Expected skip_slow_loader block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          adb logcat -c || true
          set +e
          python3 scripts/kwai_ui_probe.py 2>&1 | tee artifacts/ui-probe-console.txt
          PROBE_RC=${PIPESTATUS[0]}
          set -e
          adb logcat -d -t 1500 > artifacts/ui-logcat.txt 2>&1 || true
          adb exec-out screencap -p > artifacts/final-screen.png || true
          exit "$PROBE_RC"
          SH
          chmod +x /tmp/install-and-probe.sh

      - name: Boot Android, install Kwai and reach login safely
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/install-and-probe.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Kwai safe login-screen proof'
            echo
            cat artifacts/installed-package.txt 2>/dev/null || true
            echo
            cat artifacts/ui-result.txt 2>/dev/null || echo 'UI result not produced.'
            echo
            echo 'Safety boundary: no credentials entered, no account authenticated, no upload or publication attempted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-login-screen-proof-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
