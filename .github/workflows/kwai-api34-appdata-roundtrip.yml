name: Kwai API34 appdata roundtrip

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-api34-appdata-roundtrip.yml'

permissions:
  contents: read

jobs:
  appdata-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current verified ARM64 Kwai bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/kwai.json
          python3 - <<'PY'
          import json,pathlib,shlex
          d=json.load(open('/tmp/kwai.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next((s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower()),None)
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'mdpi' in (s.get('name') or '').lower()),None) or next((s for s in splits if s.get('type')=='DENSITY'),None)
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'ABI':(abi or {}).get('path'),'DENSITY':(den or {}).get('path')}
          if not all(vals.values()): raise SystemExit('missing bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={shlex.quote(str(v))}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.density.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          feat=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if feat: pathlib.Path('/tmp/feature-url').write_text(feat['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/roundtrip.sh <<'SH'
          set -uo pipefail
          mkdir -p artifacts
          : > artifacts/result.txt
          STAGE=init
          finish() {
            rc=$?
            echo "final_stage=$STAGE" >> artifacts/result.txt
            echo "exit_code=$rc" >> artifacts/result.txt
          }
          trap finish EXIT
          stage() { STAGE="$1"; echo "stage=$1" >> artifacts/result.txt; }
          fail() { echo "failure=$1" >> artifacts/result.txt; exit "${2:-1}"; }

          stage=boot_check
          adb wait-for-device || fail adb_wait 11
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; do sleep 2; done
          echo "build_type=$(adb shell getprop ro.build.type | tr -d '\r')" >> artifacts/result.txt
          echo "debuggable=$(adb shell getprop ro.debuggable | tr -d '\r')" >> artifacts/result.txt

          stage install
          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.density.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}" >/dev/null || fail install_failed 12

          stage launch
          adb shell am start -n com.kwai.video/com.yxcorp.gifshow.tiny.TinyLaunchActivity >/dev/null || fail launch_failed 13
          sleep 5
          adb shell am force-stop com.kwai.video || true
          PKGLINE="$(adb shell cmd package list packages -U com.kwai.video | tr -d '\r')"
          echo "package_uid_line=$PKGLINE" >> artifacts/result.txt

          stage root_probe
          ROOT_OUT="$(adb root 2>&1 || true)"
          echo "adb_root_output=$ROOT_OUT" >> artifacts/result.txt
          sleep 2
          adb wait-for-device || true
          ROOT_ID="$(adb shell id 2>&1 | tr -d '\r')"
          echo "root_identity=$ROOT_ID" >> artifacts/result.txt
          if ! echo "$ROOT_ID" | grep -q 'uid=0(root)'; then
            echo 'root_supported=false' >> artifacts/result.txt
            fail root_unavailable 30
          fi
          echo 'root_supported=true' >> artifacts/result.txt

          stage data_dir
          DATA=/data/user/0/com.kwai.video
          if ! adb shell test -d "$DATA"; then
            DATA=/data/data/com.kwai.video
          fi
          echo "data_dir=$DATA" >> artifacts/result.txt
          adb shell test -d "$DATA" || fail data_dir_missing 31
          UIDNUM="$(adb shell stat -c %u "$DATA" 2>/dev/null | tr -d '\r')"
          if ! echo "$UIDNUM" | grep -Eq '^[0-9]+$'; then
            UIDNUM="$(echo "$PKGLINE" | sed -n 's/.* uid:\([0-9][0-9]*\).*/\1/p')"
          fi
          echo "app_uid=$UIDNUM" >> artifacts/result.txt
          echo "$UIDNUM" | grep -Eq '^[0-9]+$' || fail uid_not_found 32

          stage marker
          adb shell mkdir -p "$DATA/files" || fail mkdir_files 33
          MARKER="kwai-roundtrip-${GITHUB_RUN_ID}"
          adb shell sh -c "printf '%s' '$MARKER' > '$DATA/files/.cloud-session-roundtrip'" || fail marker_write 34
          adb shell chown "$UIDNUM:$UIDNUM" "$DATA/files/.cloud-session-roundtrip" || fail marker_chown 35

          stage archive
          adb shell tar -cpf /data/local/tmp/kwai-appdata.tar -C "$DATA" . || fail archive_create 36
          ARCHIVE_BYTES="$(adb shell stat -c %s /data/local/tmp/kwai-appdata.tar 2>/dev/null | tr -d '\r')"
          echo "archive_bytes=$ARCHIVE_BYTES" >> artifacts/result.txt
          echo "$ARCHIVE_BYTES" | grep -Eq '^[1-9][0-9]*$' || fail archive_empty 37

          stage clear
          adb shell pm clear com.kwai.video >/dev/null || fail pm_clear 38
          if adb shell test -f "$DATA/files/.cloud-session-roundtrip"; then
            fail marker_survived_clear 39
          fi
          echo 'marker_removed_by_clear=true' >> artifacts/result.txt

          stage restore
          adb shell mkdir -p "$DATA" || fail restore_mkdir 40
          adb shell tar -xpf /data/local/tmp/kwai-appdata.tar -C "$DATA" || fail restore_extract 41
          adb shell chown -R "$UIDNUM:$UIDNUM" "$DATA" || fail restore_chown 42
          adb shell restorecon -RF "$DATA" >/dev/null 2>&1 || true
          RESTORED="$(adb shell cat "$DATA/files/.cloud-session-roundtrip" 2>/dev/null | tr -d '\r')"
          [ "$RESTORED" = "$MARKER" ] || fail marker_not_restored 43
          echo 'marker_restored=true' >> artifacts/result.txt

          stage relaunch
          adb shell am start -n com.kwai.video/com.yxcorp.gifshow.tiny.TinyLaunchActivity >/dev/null || fail relaunch_failed 44
          sleep 5
          PID="$(adb shell pidof com.kwai.video | tr -d '\r')"
          [ -n "$PID" ] || fail relaunch_no_pid 45
          echo 'app_relaunch_after_restore=true' >> artifacts/result.txt
          echo 'roundtrip_success=true' >> artifacts/result.txt
          STAGE=complete
          adb shell rm -f /data/local/tmp/kwai-appdata.tar || true
          exit 0
          SH
          chmod +x /tmp/roundtrip.sh

      - name: Boot API34 and test app-data save restore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/roundtrip.sh

      - name: Summary
        if: always()
        shell: bash
        run: cat artifacts/result.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload safe result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-appdata-roundtrip-${{ github.run_id }}
          path: artifacts/result.txt
          if-no-files-found: warn
          retention-days: 1
