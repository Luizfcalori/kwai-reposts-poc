name: Kwai API34 appdata roundtrip

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-api34-appdata-roundtrip.yml'

permissions:
  contents: read

jobs:
  appdata-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current verified ARM64 Kwai bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/kwai.json
          python3 - <<'PY'
          import json,pathlib,shlex
          d=json.load(open('/tmp/kwai.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next((s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower()),None)
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'mdpi' in (s.get('name') or '').lower()),None) or next((s for s in splits if s.get('type')=='DENSITY'),None)
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'ABI':(abi or {}).get('path'),'DENSITY':(den or {}).get('path')}
          if not all(vals.values()): raise SystemExit('missing bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={shlex.quote(str(v))}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.density.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          feat=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if feat: pathlib.Path('/tmp/feature-url').write_text(feat['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/roundtrip.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; do sleep 2; done

          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.density.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}" >/dev/null

          adb shell am start -n com.kwai.video/com.yxcorp.gifshow.tiny.TinyLaunchActivity >/dev/null
          sleep 5
          adb shell am force-stop com.kwai.video

          UIDNUM="$(adb shell dumpsys package com.kwai.video | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')"
          test -n "$UIDNUM"

          ROOT_OUT="$(adb root 2>&1 || true)"
          sleep 2
          adb wait-for-device
          ROOT_ID="$(adb shell id | tr -d '\r')"
          echo "$ROOT_ID" | grep -q 'uid=0(root)'

          DATA=/data/user/0/com.kwai.video
          adb shell test -d "$DATA"
          MARKER="kwai-roundtrip-${GITHUB_RUN_ID}"
          adb shell sh -c "printf '%s' '$MARKER' > '$DATA/files/.cloud-session-roundtrip'"
          adb shell chown "$UIDNUM:$UIDNUM" "$DATA/files/.cloud-session-roundtrip"

          adb shell tar -cpf /data/local/tmp/kwai-appdata.tar -C "$DATA" .
          ARCHIVE_BYTES="$(adb shell stat -c %s /data/local/tmp/kwai-appdata.tar | tr -d '\r')"
          test "$ARCHIVE_BYTES" -gt 0

          adb shell pm clear com.kwai.video >/dev/null
          if adb shell sh -c "test -f '$DATA/files/.cloud-session-roundtrip'"; then
            echo 'marker unexpectedly survived pm clear' >&2
            exit 20
          fi

          adb shell mkdir -p "$DATA"
          adb shell tar -xpf /data/local/tmp/kwai-appdata.tar -C "$DATA"
          adb shell chown -R "$UIDNUM:$UIDNUM" "$DATA"
          adb shell restorecon -RF "$DATA" >/dev/null 2>&1 || true

          RESTORED="$(adb shell cat "$DATA/files/.cloud-session-roundtrip" | tr -d '\r')"
          test "$RESTORED" = "$MARKER"

          adb shell am start -n com.kwai.video/com.yxcorp.gifshow.tiny.TinyLaunchActivity >/dev/null
          sleep 5
          PID="$(adb shell pidof com.kwai.video | tr -d '\r')"
          test -n "$PID"

          {
            echo 'root_supported=true'
            echo "root_identity=$ROOT_ID"
            echo "app_uid=$UIDNUM"
            echo "archive_bytes=$ARCHIVE_BYTES"
            echo 'marker_removed_by_clear=true'
            echo 'marker_restored=true'
            echo 'app_relaunch_after_restore=true'
            echo 'roundtrip_success=true'
          } | tee artifacts/result.txt

          adb shell rm -f /data/local/tmp/kwai-appdata.tar
          SH
          chmod +x /tmp/roundtrip.sh

      - name: Boot API34 and test app-data save restore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/roundtrip.sh

      - name: Summary
        if: always()
        shell: bash
        run: cat artifacts/result.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload safe result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-appdata-roundtrip-${{ github.run_id }}
          path: artifacts/result.txt
          if-no-files-found: warn
          retention-days: 1
