name: Kwai Play Store basis delivery proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-playstore-basis-proof.yml'
      - 'scripts/kwai_ui_probe.py'
      - 'scripts/kwai_ui_probe_confirm.py'
      - 'scripts/kwai_phone_route_probe.py'

permissions:
  contents: read

jobs:
  playstore-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare current verified Kwai ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/meta.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next(s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower())
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'mdpi' in (s.get('name') or '').lower()),None) or next(s for s in splits if s.get('type')=='DENSITY')
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'VERSION':f.get('vername'),'ABI':abi.get('path'),'DENSITY':den.get('path')}
          if not all(vals.values()): raise SystemExit('missing bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          pathlib.Path('artifacts/source.txt').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.mdpi.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          f=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if f: pathlib.Path('/tmp/feature-url').write_text(f['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/run.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; do sleep 2; done
          sleep 15
          {
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "abilist64=$(adb shell getprop ro.product.cpu.abilist64 | tr -d '\r')"
            echo "native_bridge=$(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"
            echo "play_store=$(adb shell pm path com.android.vending | tr -d '\r')"
            echo "gms=$(adb shell pm path com.google.android.gms | head -1 | tr -d '\r')"
          } | tee artifacts/environment.txt
          grep -q 'arm64-v8a' artifacts/environment.txt
          grep -q 'com.android.vending' <(adb shell pm list packages) || { echo 'Play Store missing'; exit 10; }

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/kwai/base.apk > artifacts/cert.txt 2>&1
          grep -qi 'bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047' artifacts/cert.txt
          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.mdpi.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}" | tee artifacts/install.txt
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell appops set com.kwai.video POST_NOTIFICATION allow 2>/dev/null || true

          adb logcat -c || true
          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 | tee artifacts/launch.txt
          sleep 12

          # Complete first-run flow; this normally triggers the basis DFM request.
          set +e
          python3 scripts/kwai_ui_probe_confirm.py > artifacts/onboarding-console.txt 2>&1
          ONBOARD_RC=$?
          set -e
          echo "onboarding_rc=$ONBOARD_RC" | tee artifacts/result.txt

          # Watch Play Core / package paths for the full basis feature delivery.
          for sec in 0 30 60 90 120 150 180 210 240; do
            if [ "$sec" != 0 ]; then sleep 30; fi
            {
              echo "===== ${sec}s ====="
              adb shell pm path com.kwai.video || true
              adb shell dumpsys package com.kwai.video | grep -E 'splitNames=|versionName=|primaryCpuAbi=' | head -n 30 || true
            } >> artifacts/split-checkpoints.txt
            if adb shell pm path com.kwai.video | grep -Eqi 'split_(basis|basis_extension)|split_basis'; then
              echo "basis_detected_at=${sec}s" | tee -a artifacts/result.txt
              break
            fi
          done

          adb logcat -d > artifacts/logcat.txt || true
          grep -Eai 'PlayCore|SplitInstall|split_api|split_install|basis|API_NOT_AVAILABLE|NETWORK_ERROR|ACCESS_DENIED|APP_NOT_OWNED|INCOMPATIBLE|MODULE_UNAVAILABLE|errorCode|feature .* api onFail' artifacts/logcat.txt > artifacts/playcore-basis-log.txt || true

          # Probe phone route only after the DFM attempt; no number/OTP is entered.
          set +e
          python3 scripts/kwai_phone_route_probe.py > artifacts/phone-probe-console.txt 2>&1
          PHONE_RC=$?
          set -e
          echo "phone_probe_rc=$PHONE_RC" | tee -a artifacts/result.txt
          cat artifacts/phone-route-result.txt 2>/dev/null | tee -a artifacts/result.txt || true
          adb shell pidof com.kwai.video | tee artifacts/pid.txt || true
          SH
          chmod +x /tmp/run.sh

      - name: Boot Android 15 Play Store and test basis delivery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Kwai Play Store basis delivery proof' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/environment.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          cat artifacts/result.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'No phone number, OTP, password, upload or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-playstore-basis-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
