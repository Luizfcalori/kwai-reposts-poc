name: Kwai TinyLogin detail map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-tiny-login-detail-map.yml'

permissions:
  contents: read

jobs:
  detail-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current Kwai base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai /tmp/jadx
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS "$API" -o /tmp/meta.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}
          url=f.get('path') or f.get('path_alt') or ''
          if not url: raise SystemExit('missing base url')
          pathlib.Path('/tmp/base-url').write_text(url)
          pathlib.Path('artifacts/version.txt').write_text(f"version={f.get('vername')}\nversionCode={f.get('vercode')}\n")
          PY
          curl -fL "$(cat /tmp/base-url)" -o /tmp/kwai/base.apk

      - name: Decompile and extract login implementation
        shell: bash
        run: |
          set -euo pipefail
          URL="$(curl -LsS https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|test("jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -1)"
          curl -fL "$URL" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          timeout 600 /tmp/jadx-bin/bin/jadx --show-bad-code -d /tmp/jadx /tmp/kwai/base.apk > artifacts/jadx-console.txt 2>&1 || true

          SRC=/tmp/jadx/sources
          RES=/tmp/jadx/resources
          {
            echo '===== AndroidManifest TinyLogin declarations ====='
            grep -n -B8 -A14 'com.yxcorp.gifshow.tiny.login.activity.TinyLoginActivity\|com.yxcorp.gifshow.tiny.login.activity.TinyGoogleSSOActivity' "$RES/AndroidManifest.xml" || true
            echo
            echo '===== TinyLoginPluginImpl ====='
            sed -n '130,235p' "$SRC/com/yxcorp/gifshow/tiny/login/TinyLoginPluginImpl.java" || true
            echo
            echo '===== TinyLoginActivity ====='
            sed -n '1,340p' "$SRC/com/yxcorp/gifshow/tiny/login/activity/TinyLoginActivity.java" || true
            echo
            echo '===== TinyGoogleSSOActivity ====='
            sed -n '1,240p' "$SRC/com/yxcorp/gifshow/tiny/login/activity/TinyGoogleSSOActivity.java" || true
            echo
            echo '===== r50/d login engine ====='
            sed -n '1,460p' "$SRC/r50/d.java" || true
            echo
            echo '===== r50/e Google engine ====='
            sed -n '1,180p' "$SRC/r50/e.java" || true
            echo
            echo '===== exact arg_tiny_login_source xrefs ====='
            grep -RIn -B12 -A20 'arg_tiny_login_source' "$SRC" || true
            echo
            echo '===== TinyLoginActivity constructors/callers ====='
            grep -RIn -B10 -A20 'new Intent(.*TinyLoginActivity\|TinyLoginActivity.class' "$SRC" || true
          } | tee artifacts/detail-map.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-tiny-login-detail-map-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
