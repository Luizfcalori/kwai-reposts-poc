name: Kwai full bundle phone login proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-full-bundle-phone-proof.yml'
      - 'scripts/kwai_ui_probe.py'
      - 'scripts/kwai_ui_probe_confirm.py'
      - 'scripts/kwai_phone_route_probe.py'

permissions:
  contents: read

jobs:
  full-bundle-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch verified 66MB Kwai bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai-full
          python3 - <<'PY'
          import html,http.cookiejar,pathlib,re,shutil,time,urllib.parse,urllib.request
          variant='https://www.apkmirror.com/apk/joyo-technology-pte-ltd-2/kwai-short-video-maker-community/kwai-video-drama-13-8-30-646601-release/kwai-video-drama-13-8-30-646601-android-apk-download/'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154 Safari/537.36'
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def req(url,ref=None,accept='text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'):
              h={'User-Agent':ua,'Accept':accept,'Accept-Language':'en-US,en;q=0.9'}
              if ref:h['Referer']=ref
              return urllib.request.Request(url,headers=h)
          def text(url,ref=None):
              with opener.open(req(url,ref),timeout=45) as r:return r.geturl(),r.read().decode('utf-8','ignore')
          vurl,p=text(variant)
          first=[]
          for pat in [r'href=["\']([^"\']+/download/\?key=[^"\']+)["\']',r'href=["\']([^"\']*download[^"\']*key=[^"\']+)["\']']:
              first += re.findall(pat,p,re.I)
          if not first: raise SystemExit('APKMirror first-stage link not found')
          stage=urllib.parse.urljoin(vurl,html.unescape(first[0]))
          surl,p2=text(stage,vurl)
          hits=[]
          for pat in [r'href=["\']([^"\']*download\.php\?id=\d+&(?:amp;)?key=[^"\']+)["\']',r'(https?://[^"\'<> ]*download\.php\?id=\d+&(?:amp;)?key=[^"\'<> ]+)']:
              hits += re.findall(pat,p2,re.I)
          if not hits: raise SystemExit('APKMirror final link not found')
          dl=urllib.parse.urljoin(surl,html.unescape(hits[0]).replace('&amp;','&'))
          time.sleep(17)
          with opener.open(req(dl,surl,'application/octet-stream,application/zip,*/*;q=0.8'),timeout=180) as r,open('/tmp/kwai-full/kwai.apkm','wb') as f:
              shutil.copyfileobj(r,f,1024*1024)
          pathlib.Path('artifacts/download.txt').write_text('bundle_download_complete=true\n')
          PY

          test "$(stat -c '%s' /tmp/kwai-full/kwai.apkm)" -eq 69569007
          echo '536ae315a4d5d5742ba5d2073c4058a57e6f3abc89150fd4b3af23ab4159492a  /tmp/kwai-full/kwai.apkm' | sha256sum -c - | tee artifacts/hash-check.txt
          unzip -q /tmp/kwai-full/kwai.apkm -d /tmp/kwai-full/unpacked
          find /tmp/kwai-full/unpacked -type f -name '*.apk' -printf '%f\t%s\n' | sort > artifacts/all-apks.txt

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/run-full.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; do sleep 2; done
          U=/tmp/kwai-full/unpacked
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BT/apksigner"

          APKS=(
            "$U/base.apk"
            "$U/split_config.arm64_v8a.apk"
            "$U/split_config.xxhdpi.apk"
            "$U/split_basis.apk"
            "$U/split_basis.config.arm64_v8a.apk"
            "$U/split_basis.config.xxhdpi.apk"
            "$U/split_basis_extension.apk"
            "$U/split_basis_extension.config.arm64_v8a.apk"
            "$U/split_dfm_ug.apk"
          )
          printf '%s\n' "${APKS[@]}" | sed "s#${U}/##" | tee artifacts/selected-apks.txt
          for apk in "${APKS[@]}"; do
            test -s "$apk"
            "$APKSIGNER" verify --print-certs "$apk" > /tmp/cert.txt 2>&1
            sha="$(awk -F': ' '/certificate SHA-256 digest:/{print tolower($NF); exit}' /tmp/cert.txt)"
            test "$sha" = 'bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047'
          done

          set +e
          adb install-multiple -r "${APKS[@]}" > artifacts/install.txt 2>&1
          IRC=$?
          set -e
          cat artifacts/install.txt
          echo "install_rc=$IRC" | tee artifacts/install-result.txt
          test "$IRC" -eq 0

          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell appops set com.kwai.video POST_NOTIFICATION allow 2>/dev/null || true
          adb shell dumpsys package com.kwai.video | grep -E 'versionName=|versionCode=|primaryCpuAbi=|splitNames=|splitCodePaths=' | head -n 60 | tee artifacts/installed-package.txt || true
          adb shell pm path com.kwai.video | tee artifacts/installed-paths.txt
          grep -q 'split_basis' artifacts/installed-paths.txt
          grep -q 'split_basis_extension' artifacts/installed-paths.txt

          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 > artifacts/launch.txt 2>&1 || true
          sleep 12
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.kwai.video' | tail -n 40 | tee artifacts/activity-after-launch.txt || true

          # Existing probes are privacy-safe: no phone number, OTP or password is entered.
          set +e
          python3 scripts/kwai_ui_probe_confirm.py 2>&1 | tee artifacts/onboarding-console.txt
          ORC=${PIPESTATUS[0]}
          python3 scripts/kwai_phone_route_probe.py 2>&1 | tee artifacts/phone-route-console.txt
          PRC=${PIPESTATUS[0]}
          set -e

          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.kwai.video' | tail -n 60 > artifacts/activity-final.txt || true
          adb shell pidof com.kwai.video | tee artifacts/pid.txt || true
          adb logcat -d -t 2500 > artifacts/logcat.txt || true
          echo "onboarding_rc=$ORC" | tee artifacts/result.txt
          echo "phone_route_rc=$PRC" | tee -a artifacts/result.txt
          cat artifacts/phone-route-result.txt 2>/dev/null | tee -a artifacts/result.txt || true
          exit "$PRC"
          SH
          chmod +x /tmp/run-full.sh

      - name: Boot Android 14 and prove full phone login route
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run-full.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Kwai full 66MB bundle phone-route proof'
            cat artifacts/hash-check.txt 2>/dev/null || true
            cat artifacts/install-result.txt 2>/dev/null || true
            cat artifacts/installed-package.txt 2>/dev/null || true
            cat artifacts/result.txt 2>/dev/null || true
            echo
            echo 'No phone number, SMS code, password, account login, upload, or publication was attempted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-full-phone-proof-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
