name: Kwai package install proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-install-proof.yml'

permissions:
  contents: read

jobs:
  install-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare KVM and download Kwai package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts apks

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo '=== APKPure versions compatible with x86/x86_64 (if any) ===' | tee artifacts/apkeep-x86-versions.txt
          docker run --rm ghcr.io/efforg/apkeep:stable \
            -l -a com.kwai.video -d apk-pure -o 'arch=x86_64;x86' \
            2>&1 | tee -a artifacts/apkeep-x86-versions.txt || true

          echo '=== Trying x86/x86_64-compatible package first ===' | tee artifacts/download.txt
          if docker run --rm -v "$PWD/apks:/output" ghcr.io/efforg/apkeep:stable \
              -a com.kwai.video -d apk-pure -o 'arch=x86_64;x86' /output \
              2>&1 | tee -a artifacts/download.txt; then
            echo 'DOWNLOAD_MODE=x86-first' | tee -a artifacts/download.txt
          else
            echo 'x86-specific download failed; falling back to the latest package metadata.' | tee -a artifacts/download.txt
            rm -f apks/*
            docker run --rm -v "$PWD/apks:/output" ghcr.io/efforg/apkeep:stable \
              -a com.kwai.video -d apk-pure /output \
              2>&1 | tee -a artifacts/download.txt
            echo 'DOWNLOAD_MODE=default-fallback' | tee -a artifacts/download.txt
          fi

          find apks -maxdepth 1 -type f -printf '%f\t%s bytes\n' | tee artifacts/downloaded-files.txt
          test -n "$(find apks -maxdepth 1 -type f -print -quit)"

          cat > /tmp/run-kwai-proof.sh <<'SH'
          set -euo pipefail
          EXPECTED_CERT='bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047'
          mkdir -p artifacts /tmp/kwai-package

          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do sleep 3; done

          {
            echo "ro.product.cpu.abi=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "ro.product.cpu.abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "ro.build.version.release=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "ro.build.version.sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          } | tee artifacts/emulator-info.txt

          BUNDLE="$(find apks -maxdepth 1 -type f | head -n1)"
          echo "BUNDLE=$BUNDLE" | tee artifacts/package-info.txt
          file "$BUNDLE" | tee -a artifacts/package-info.txt

          case "$BUNDLE" in
            *.xapk|*.zip)
              unzip -q "$BUNDLE" -d /tmp/kwai-package
              ;;
            *.apk)
              cp "$BUNDLE" /tmp/kwai-package/base.apk
              ;;
            *)
              echo "Unsupported package extension: $BUNDLE" | tee artifacts/result.txt
              exit 1
              ;;
          esac

          mapfile -d '' APKS < <(find /tmp/kwai-package -type f -name '*.apk' -print0)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo 'FAIL: no APK files were found inside the downloaded package.' | tee artifacts/result.txt
            exit 1
          fi

          echo "APK_COUNT=${#APKS[@]}" | tee -a artifacts/package-info.txt
          printf '%s\n' "${APKS[@]}" | tee artifacts/apk-files.txt

          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          fi
          test -n "$APKSIGNER"

          : > artifacts/certificates.txt
          for apk in "${APKS[@]}"; do
            echo "=== $apk ===" | tee -a artifacts/certificates.txt
            CERT="$($APKSIGNER verify --print-certs "$apk" 2>&1 | tee -a artifacts/certificates.txt | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [ -z "$CERT" ]; then
              echo "FAIL: could not read certificate from $apk" | tee artifacts/result.txt
              exit 1
            fi
            if [ "$CERT" != "$EXPECTED_CERT" ]; then
              echo "FAIL: Kwai certificate mismatch on $apk: $CERT" | tee artifacts/result.txt
              exit 1
            fi
          done

          set +e
          if [ "${#APKS[@]}" -eq 1 ]; then
            adb install -r "${APKS[0]}" 2>&1 | tee artifacts/install.txt
            INSTALL_RC=${PIPESTATUS[0]}
          else
            adb install-multiple -r "${APKS[@]}" 2>&1 | tee artifacts/install.txt
            INSTALL_RC=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$INSTALL_RC" -ne 0 ]; then
            echo "FAIL_INSTALL: com.kwai.video package was downloaded and signature-verified, but Android rejected installation. See install.txt and emulator-info.txt." | tee artifacts/result.txt
            exit 1
          fi

          if ! adb shell pm path com.kwai.video | tee artifacts/pm-path.txt | grep -q '^package:'; then
            echo 'FAIL: install command succeeded but com.kwai.video is not registered.' | tee artifacts/result.txt
            exit 1
          fi

          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 2>&1 | tee artifacts/launch.txt || true
          sleep 15
          adb exec-out screencap -p > artifacts/kwai-open.png
          adb shell uiautomator dump /sdcard/kwai.xml >/dev/null 2>&1 || true
          adb pull /sdcard/kwai.xml artifacts/kwai-open.xml >/dev/null 2>&1 || true

          if adb shell pidof com.kwai.video | tee artifacts/pid.txt | grep -Eq '[0-9]'; then
            echo 'PASS: com.kwai.video installed, certificate verified, and Kwai process is running in the cloud Android emulator.' | tee artifacts/result.txt
          else
            echo 'PARTIAL: com.kwai.video installed, but the Kwai process was not running after launch attempt.' | tee artifacts/result.txt
            exit 1
          fi
          SH
          chmod +x /tmp/run-kwai-proof.sh

      - name: Boot Android, verify package, install and open Kwai
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run-kwai-proof.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Kwai package install proof'
            cat artifacts/result.txt 2>/dev/null || echo 'FAIL: proof did not finish.'
            echo
            cat artifacts/emulator-info.txt 2>/dev/null || true
            echo
            cat artifacts/downloaded-files.txt 2>/dev/null || true
            echo
            echo 'No Kwai account login and no video publication performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-install-proof-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
