name: Kwai complete bundle phone class map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-aab-phone-class-map.yml'

permissions:
  contents: read

jobs:
  class-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download complete Kwai bundle from APKPure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts apks /tmp/kwai-package /tmp/dex
          docker run --rm -v "$PWD/apks:/output" ghcr.io/efforg/apkeep:stable \
            -a com.kwai.video -d apk-pure \
            -o 'acknowledge_dangers=true,arch=x86_64;x86' /output \
            2>&1 | tee artifacts/apkeep-download.txt

          BUNDLE="$(find apks -maxdepth 1 -type f | head -n1)"
          test -n "$BUNDLE"
          echo "bundle=$BUNDLE" | tee artifacts/bundle.txt
          case "$BUNDLE" in
            *.xapk|*.zip) unzip -q "$BUNDLE" -d /tmp/kwai-package ;;
            *.apk) cp "$BUNDLE" /tmp/kwai-package/base.apk ;;
            *) echo "Unsupported bundle: $BUNDLE"; exit 1 ;;
          esac
          find /tmp/kwai-package -type f -name '*.apk' -printf '%p\t%s bytes\n' | sort > artifacts/apk-inventory.txt
          cat artifacts/apk-inventory.txt

      - name: Scan all package APKs and DEX for real login implementation
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"
          PAT='PhoneAccountActivityV2|PhoneAccountActivity|PhoneVerifyActivity|ForcePhoneRegisterActivity|CommonLoginActivity|SplashLoginActivity|AutoLoginActivity|AutoLogoutActivity|BindPhoneActivity|PhoneResetPsdActivity|userlogin|PHONE_NUMBER_LOGIN_PAGE|CLICK_PHONE_LOGIN|INPUT_PHONE_NUMBER_IN_LOGIN_PROCESS|PURE_PHONE_QUICK_LOGIN|RouterPlugin|UriRouterActivity'
          EXACT='Lcom/yxcorp/gifshow/login/PhoneAccountActivityV2;|Lcom/yxcorp/gifshow/login/PhoneVerifyActivity;|Lcom/yxcorp/gifshow/login/ForcePhoneRegisterActivity;|Lcom/yxcorp/gifshow/login/activity/CommonLoginActivity;|Lcom/yxcorp/login/userlogin/activity/AutoLoginActivity;'
          : > artifacts/certificates.txt
          : > artifacts/badging.txt
          : > artifacts/dex-hits.txt
          : > artifacts/exact-class-apks.txt
          : > artifacts/manifest-hits.txt
          : > artifacts/dex-inventory.txt

          n=0
          while IFS= read -r -d '' apk; do
            n=$((n+1)); b="$(basename "$apk")"; d="/tmp/dex/$n"; mkdir -p "$d"
            echo "===== $b =====" >> artifacts/certificates.txt
            "$APKSIGNER" verify --print-certs "$apk" >> artifacts/certificates.txt 2>&1 || true
            echo "===== $b =====" >> artifacts/badging.txt
            "$AAPT" dump badging "$apk" >> artifacts/badging.txt 2>&1 || true
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$d/manifest.txt" 2>/dev/null || true
            mh="$(grep -Eai -C 6 "$PAT" "$d/manifest.txt" || true)"
            [ -z "$mh" ] || { echo "===== $b ====="; echo "$mh"; } >> artifacts/manifest-hits.txt
            unzip -qq "$apk" 'classes*.dex' -d "$d" 2>/dev/null || true
            for dex in "$d"/classes*.dex; do
              [ -f "$dex" ] || continue
              echo "$b :: $(basename "$dex") :: $(stat -c%s "$dex")" >> artifacts/dex-inventory.txt
              h="$(strings -a "$dex" | grep -Eai "$PAT" | sort -u || true)"
              [ -z "$h" ] || { echo "===== $b :: $(basename "$dex") ====="; echo "$h"; } >> artifacts/dex-hits.txt
              if strings -a "$dex" | grep -Eq "$EXACT"; then
                echo "$apk" >> artifacts/exact-class-apks.txt
                echo "EXACT_CLASS_DEX=$dex" >> artifacts/exact-class-apks.txt
              fi
            done
          done < <(find /tmp/kwai-package -type f -name '*.apk' -print0)

          sort -u artifacts/exact-class-apks.txt -o artifacts/exact-class-apks.txt
          echo '--- exact implementation APKs ---'; cat artifacts/exact-class-apks.txt || true
          echo '--- strongest DEX hits ---'; grep -Eai -C 3 'PhoneAccountActivityV2|PhoneVerifyActivity|ForcePhoneRegisterActivity|CommonLoginActivity|AutoLoginActivity|userlogin' artifacts/dex-hits.txt | head -n 1600 || true
          echo '--- package/version ---'; grep -E "package: name='com.kwai.video'|versionCode=|versionName=" artifacts/badging.txt | head -n 30 || true

      - name: Extract exact login-class neighborhood when present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          pats=[
            b'Lcom/yxcorp/gifshow/login/PhoneAccountActivityV2;',
            b'Lcom/yxcorp/gifshow/login/PhoneVerifyActivity;',
            b'Lcom/yxcorp/gifshow/login/ForcePhoneRegisterActivity;',
            b'Lcom/yxcorp/gifshow/login/activity/CommonLoginActivity;',
            b'Lcom/yxcorp/login/userlogin/activity/AutoLoginActivity;'
          ]
          out=[]
          for dex in Path('/tmp/dex').rglob('classes*.dex'):
              data=dex.read_bytes()
              if not any(p in data for p in pats): continue
              ss=subprocess.run(['strings','-a',str(dex)],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL).stdout.splitlines()
              out.append(f'===== {dex} =====')
              rx=re.compile(r'PhoneAccount|PhoneVerify|ForcePhone|CommonLogin|AutoLogin|userlogin|phone.{0,30}login|login.{0,30}phone|kwai://|ikwai://|route|router|source|loginType',re.I)
              hits=[(i,s) for i,s in enumerate(ss) if rx.search(s)]
              used=set()
              for i,s in hits:
                  for j in range(max(0,i-4),min(len(ss),i+5)):
                      if j not in used: out.append(f'{j}: {ss[j]}'); used.add(j)
                  out.append('---')
          Path('artifacts/exact-login-neighborhood.txt').write_text('\n'.join(out),encoding='utf-8')
          print('neighborhood_lines=',len(out))
          PY
          head -n 2400 artifacts/exact-login-neighborhood.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-complete-bundle-phone-map-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
