name: Kwai public auth route proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-public-auth-route-proof.yml'
      - 'scripts/kwai_ui_probe.py'
      - 'scripts/kwai_ui_probe_confirm.py'

permissions:
  contents: read

jobs:
  auth-route-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare current verified Kwai ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/meta.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next(s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower())
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'mdpi' in (s.get('name') or '').lower()),None) or next(s for s in splits if s.get('type')=='DENSITY')
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'VERSION':f.get('vername'),'ABI':abi.get('path'),'DENSITY':den.get('path')}
          if not all(vals.values()): raise SystemExit('missing bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          pathlib.Path('artifacts/source.txt').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.mdpi.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          f=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if f: pathlib.Path('/tmp/feature-url').write_text(f['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/route_probe.py <<'PY'
          import pathlib,re,subprocess,time,xml.etree.ElementTree as ET
          A=pathlib.Path('artifacts/routes'); A.mkdir(parents=True,exist_ok=True)
          def adb(*a): return subprocess.run(['adb',*a],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          def dump(tag):
              adb('shell','uiautomator','dump','/sdcard/route.xml')
              adb('pull','/sdcard/route.xml',str(A/f'{tag}.xml'))
              with open(A/f'{tag}.png','wb') as f: subprocess.run(['adb','exec-out','screencap','-p'],stdout=f,stderr=subprocess.DEVNULL)
              texts=[]; cls=[]
              try:
                  root=ET.parse(A/f'{tag}.xml').getroot()
                  for n in root.iter('node'):
                      for k in ('text','content-desc','hint'):
                          v=(n.attrib.get(k) or '').strip()
                          if v and v not in texts: texts.append(v)
                      c=(n.attrib.get('class') or '').strip()
                      if c and c not in cls: cls.append(c)
              except Exception: pass
              top=adb('shell','dumpsys','activity','activities').stdout
              m=re.search(r'mResumedActivity:.*? ([^ ]+)/(\S+)',top)
              resumed=(m.group(1)+'/'+m.group(2)) if m else ''
              (A/f'{tag}.txt').write_text('RESUMED='+resumed+'\n'+'\n'.join(texts),encoding='utf-8')
              return texts,resumed
          def classify(texts,resumed):
              s='\n'.join(texts)
              if re.search(r'phone number|mobile number|n[uú]mero de telefone|country code|get code|send code|c[oó]digo de verifica',s,re.I): return 'phone'
              if 'PhoneAccountActivity' in resumed or 'PhoneVerifyActivity' in resumed: return 'phone_activity'
              if re.search(r'continue with google',s,re.I) and 'tiny' in resumed.lower(): return 'tiny_login'
              if re.search(r'log in|login|sign in|entrar|create account|sign up',s,re.I): return 'login'
              return 'other'
          candidates=[
              ('ikwai_authorization',['shell','am','start','-W','-a','android.intent.action.VIEW','-d','ikwai://authorization','com.kwai.video']),
              ('kwai_authorization',['shell','am','start','-W','-a','android.intent.action.VIEW','-d','kwai://authorization','com.kwai.video']),
              ('explicit_ikwai_auth',['shell','am','start','-W','-n','com.kwai.video/com.yxcorp.gifshow.authorization.KwaiAuthActivity','-a','android.intent.action.VIEW','-d','ikwai://authorization']),
              ('home_select_force',['shell','am','start','-W','-a','android.intent.action.VIEW','-d','ikwai://home/select?inject_kwai_force_login=1','com.kwai.video']),
              ('webview_force',['shell','am','start','-W','-a','android.intent.action.VIEW','-d','ikwai://webview?inject_kwai_force_login=1','com.kwai.video']),
              ('home_hot_force',['shell','am','start','-W','-n','com.kwai.video/com.kscorp.oversea.platform.router.ui.UriRouterActivity','-a','android.intent.action.VIEW','-d','ikwai://ug.pro/home/hot?inject_kwai_force_login=1']),
          ]
          results=[]
          for name,cmd in candidates:
              adb('shell','am','force-stop','com.kwai.video'); time.sleep(1)
              out=adb(*cmd).stdout
              (A/f'{name}-start.txt').write_text(out,encoding='utf-8')
              time.sleep(6)
              texts,resumed=dump(name)
              state=classify(texts,resumed)
              results.append(f'{name}: state={state} resumed={resumed}')
              if state in {'phone','phone_activity'}:
                  break
          pathlib.Path('artifacts/route-results.txt').write_text('\n'.join(results)+'\n',encoding='utf-8')
          print('\n'.join(results))
          PY

          cat > /tmp/run.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; do sleep 2; done
          sleep 10
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/kwai/base.apk > artifacts/cert.txt 2>&1
          grep -qi 'bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047' artifacts/cert.txt
          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.mdpi.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}" | tee artifacts/install.txt
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell appops set com.kwai.video POST_NOTIFICATION allow 2>/dev/null || true
          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          sleep 10
          # Finish onboarding once so public auth routes are not masked by first-run UI.
          set +e
          python3 scripts/kwai_ui_probe_confirm.py > artifacts/onboarding-console.txt 2>&1
          set -e
          adb shell input keyevent 4 || true
          sleep 2
          python3 /tmp/route_probe.py | tee artifacts/route-console.txt
          adb logcat -d -t 2500 > artifacts/logcat.txt || true
          SH
          chmod +x /tmp/run.sh

      - name: Boot Android and probe public auth routes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Kwai public auth route proof' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/route-results.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'No phone number, OTP, password, upload or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-public-auth-route-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
