name: Kwai API34 Brazil locale phone proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-api34-br-locale-phone-proof.yml'

permissions:
  contents: read

jobs:
  br-phone-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare current verified Kwai bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/meta.json
          python3 - <<'PY'
          import json,pathlib,shlex
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next(s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower())
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'hdpi' in (s.get('name') or '').lower()),None) or next(s for s in splits if s.get('type')=='DENSITY')
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'VERSION':f.get('vername'),'ABI':abi.get('path'),'DENSITY':den.get('path')}
          if not all(vals.values()): raise SystemExit('missing bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={shlex.quote(str(v))}' for k,v in vals.items())+'\n')
          pathlib.Path('artifacts/source.txt').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.density.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          feat=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if feat: pathlib.Path('/tmp/feature-url').write_text(feat['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/run.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; do sleep 2; done
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/kwai/base.apk > artifacts/cert.txt 2>&1
          grep -qi 'bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047' artifacts/cert.txt
          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.density.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}" | tee artifacts/install.txt

          adb shell settings put system system_locales pt-BR || true
          adb shell cmd locale set-app-locales com.kwai.video --user 0 pt-BR || true
          adb shell setprop persist.sys.timezone America/Sao_Paulo || true
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell appops set com.kwai.video POST_NOTIFICATION allow 2>/dev/null || true
          {
            echo "system_locales=$(adb shell settings get system system_locales | tr -d '\r')"
            echo "app_locales=$(adb shell cmd locale get-app-locales com.kwai.video --user 0 2>&1 | tr -d '\r')"
            echo "timezone=$(adb shell getprop persist.sys.timezone | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            adb shell ip route || true
          } | tee artifacts/environment.txt

          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          sleep 10
          set +e
          python3 scripts/kwai_ui_probe_confirm.py 2>&1 | tee artifacts/onboarding-console.txt
          ONBOARD_RC=${PIPESTATUS[0]}
          python3 scripts/kwai_phone_route_probe.py 2>&1 | tee artifacts/phone-route-console.txt
          PHONE_RC=${PIPESTATUS[0]}
          set -e
          echo "onboarding_rc=$ONBOARD_RC" | tee artifacts/result.txt
          echo "phone_route_rc=$PHONE_RC" | tee -a artifacts/result.txt
          SH
          chmod +x /tmp/run.sh

      - name: Boot Android 14 in pt-BR and inspect supported login UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Kwai Android 14 Brazil-locale phone login proof'
            cat artifacts/environment.txt 2>/dev/null || true
            echo
            cat artifacts/result.txt 2>/dev/null || true
            cat artifacts/phone-route-result.txt 2>/dev/null || true
            echo
            echo 'Only the supported app UI was inspected. No number, OTP, password, upload, or publication was attempted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-api34-br-locale-phone-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
