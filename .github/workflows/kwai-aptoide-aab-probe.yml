name: Kwai Aptoide AAB probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-aptoide-aab-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Aptoide app, AAB and dynamic split metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 3 --retry-delay 2 -w '%{http_code}\n' "$API" -o "$RUNNER_TEMP/kwai.json" | tee artifacts/http-status.txt
          python3 - "$RUNNER_TEMP/kwai.json" <<'PY'
          import json,sys,pathlib
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          pathlib.Path('artifacts/status.txt').write_text('info_status='+str(data.get('info',{}).get('status'))+'\n')
          nodes=data.get('nodes') or {}
          meta=((nodes.get('meta') or {}).get('data') or {})
          f=meta.get('file') or {}
          aab=meta.get('aab') or {}
          lines=[
              f"package={meta.get('package')}",
              f"name={meta.get('name')}",
              f"version={f.get('vername')}",
              f"vercode={f.get('vercode')}",
              f"base_size={f.get('filesize') or f.get('size') or meta.get('size')}",
              f"base_md5={f.get('md5sum')}",
              f"base_path_present={bool(f.get('path') or f.get('path_alt'))}",
              f"meta_aab_type={type(meta.get('aab')).__name__}",
              f"nodes={','.join(sorted(nodes.keys()))}",
          ]
          pathlib.Path('artifacts/meta.txt').write_text('\n'.join(lines)+'\n')

          def walk(obj,prefix=''):
              out=[]
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f'{prefix}.{k}' if prefix else k
                      if isinstance(v,(dict,list)):
                          out.extend(walk(v,p))
                      elif any(x in k.lower() for x in ('path','name','type','size','md5','split','ver')):
                          out.append((p,str(v)))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      out.extend(walk(v,f'{prefix}[{i}]'))
              return out
          structural=walk({'meta_aab':aab})
          pathlib.Path('artifacts/aab-structure.txt').write_text('\n'.join(f'{k}={v}' for k,v in structural)+'\n')

          versions=(nodes.get('versions') or {}).get('list') or (nodes.get('versions') or {}).get('datalist',{}).get('list') or []
          vlines=[]
          for v in versions[:100]:
              vf=v.get('file') or {}
              vlines.append(f"{vf.get('vername')}\t{vf.get('vercode')}\t{vf.get('filesize') or vf.get('size') or v.get('size')}\t{vf.get('md5sum')}\tpath={bool(vf.get('path') or vf.get('path_alt'))}")
          pathlib.Path('artifacts/versions.txt').write_text('\n'.join(vlines)+'\n')

          blob=json.dumps(aab,ensure_ascii=False).lower()
          pathlib.Path('artifacts/base-result.txt').write_text(
              f'AAB_PRESENT={str(bool(aab)).lower()}\n'
              f'BASE_FULL_DYNAMIC_FEATURES_PRESENT={str(any(x in blob for x in ("basis_extension","basis.config","\"basis\""))).lower()}\n'
          )
          if data.get('info',{}).get('status') != 'OK':
              raise SystemExit('Aptoide returned non-OK status')
          PY

          MD5='c9dfcd8ce1e6498ace9c59db173a0805'
          DYN="https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT"
          curl -LsS --retry 3 --retry-delay 2 -w '%{http_code}\n' "$DYN" -o "$RUNNER_TEMP/dynamic.json" | tee artifacts/dynamic-http-status.txt
          python3 - "$RUNNER_TEMP/dynamic.json" <<'PY'
          import json,sys,pathlib
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          pathlib.Path('artifacts/dynamic-status.txt').write_text('info_status='+str(data.get('info',{}).get('status'))+'\n')
          def walk(obj,prefix=''):
              out=[]
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f'{prefix}.{k}' if prefix else k
                      if isinstance(v,(dict,list)):
                          out.extend(walk(v,p))
                      elif any(x in k.lower() for x in ('path','name','type','size','md5','split','deliver')):
                          out.append((p,str(v)))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj): out.extend(walk(v,f'{prefix}[{i}]'))
              return out
          structure=walk(data)
          pathlib.Path('artifacts/dynamic-structure.txt').write_text('\n'.join(f'{k}={v}' for k,v in structure)+'\n')
          blob=json.dumps(data,ensure_ascii=False).lower()
          names=[]
          def collect(o):
              if isinstance(o,dict):
                  n=o.get('name')
                  if isinstance(n,str): names.append(n)
                  for v in o.values(): collect(v)
              elif isinstance(o,list):
                  for v in o: collect(v)
          collect(data)
          pathlib.Path('artifacts/dynamic-names.txt').write_text('\n'.join(dict.fromkeys(names))+'\n')
          full=any(x in blob for x in ('basis_extension','basis.config','"basis"'))
          urls=blob.count('https://')
          pathlib.Path('artifacts/result.txt').write_text(
              f'DYNAMIC_FEATURES_PRESENT={str(full).lower()}\nURL_MARKERS={urls}\n'
          )
          print('dynamic_status=',data.get('info',{}).get('status'))
          print('names=',names[:40])
          print('DYNAMIC_FEATURES_PRESENT=',full,'URL_MARKERS=',urls)
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Aptoide AAB/dynamic split probe'
            cat artifacts/http-status.txt 2>/dev/null || true
            cat artifacts/status.txt 2>/dev/null || true
            cat artifacts/meta.txt 2>/dev/null || true
            cat artifacts/base-result.txt 2>/dev/null || true
            echo 'Dynamic endpoint:'
            cat artifacts/dynamic-http-status.txt 2>/dev/null || true
            cat artifacts/dynamic-status.txt 2>/dev/null || true
            cat artifacts/result.txt 2>/dev/null || true
            echo 'Dynamic names:'
            cat artifacts/dynamic-names.txt 2>/dev/null || true
            echo 'Dynamic structure:'
            head -n 160 artifacts/dynamic-structure.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-aptoide-aab-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
