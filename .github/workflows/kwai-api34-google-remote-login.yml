name: Kwai API34 protected Google remote login

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-api34-google-remote-login.yml'

permissions:
  contents: read

jobs:
  remote-google-login-api34:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: ':99'
      KWAI_REMOTE_EMAIL: ${{ secrets.KWAI_REMOTE_EMAIL }}
    steps:
      - name: Check protected-access configuration
        id: access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KWAI_REMOTE_EMAIL:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Protected Kwai remote login'
              echo
              echo 'KWAI_REMOTE_EMAIL is not configured yet.'
              echo 'Add it as a GitHub Actions repository secret, then re-run this workflow.'
              echo 'No emulator or public tunnel was started.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.access.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install protected remote-desktop dependencies
        if: steps.access.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify >/dev/null
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          mkdir -p /tmp/kwai-remote

          Xvfb :99 -screen 0 1280x2400x24 -ac +extension GLX +render -noreset >/tmp/kwai-remote/xvfb.log 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet >/tmp/kwai-remote/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/kwai-remote/websockify.log 2>&1 &
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 --allowed-mail "$KWAI_REMOTE_EMAIL" >/tmp/kwai-remote/cloudflared.log 2>&1 &

          URL=''
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/kwai-remote/cloudflared.log | tail -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            cat /tmp/kwai-remote/cloudflared.log
            exit 1
          fi
          echo "$URL/vnc.html?autoconnect=1&resize=scale" > /tmp/kwai-remote/url.txt
          {
            echo '## Protected remote Android session'
            echo
            echo "Open: $URL/vnc.html?autoconnect=1&resize=scale"
            echo
            echo 'Cloudflare will send a one-time PIN only to the email stored in the KWAI_REMOTE_EMAIL secret.'
            echo 'Do not share the tunnel URL. It stops when this job ends.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download current verified Kwai bundle
        if: steps.access.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kwai
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/kwai.json
          python3 - <<'PY'
          import json,pathlib,shlex
          d=json.load(open('/tmp/kwai.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}; splits=(m.get('aab') or {}).get('splits') or []
          abi=next((s for s in splits if s.get('type')=='ABI' and 'arm64' in (s.get('name') or '').lower()),None)
          den=next((s for s in splits if s.get('type')=='DENSITY' and 'mdpi' in (s.get('name') or '').lower()),None) or next((s for s in splits if s.get('type')=='DENSITY'),None)
          vals={'BASE':f.get('path') or f.get('path_alt'),'MD5':f.get('md5sum'),'ABI':(abi or {}).get('path'),'DENSITY':(den or {}).get('path')}
          if not all(vals.values()): raise SystemExit('missing required bundle metadata')
          pathlib.Path('/tmp/meta.env').write_text('\n'.join(f'{k}={shlex.quote(str(v))}' for k,v in vals.items())+'\n')
          PY
          source /tmp/meta.env
          curl -fL --retry 4 --retry-delay 2 "$BASE" -o /tmp/kwai/base.apk
          curl -fL --retry 4 --retry-delay 2 "$ABI" -o /tmp/kwai/config.arm64_v8a.apk
          curl -fL --retry 4 --retry-delay 2 "$DENSITY" -o /tmp/kwai/config.density.apk
          curl -LsS "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=${MD5}/language=pt_PT" -o /tmp/dynamic.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          feat=next((x for x in d.get('list',[]) if x.get('type')=='FEATURE' and x.get('path')),None)
          if feat: pathlib.Path('/tmp/feature-url').write_text(feat['path'])
          PY
          if [ -s /tmp/feature-url ]; then curl -fL "$(cat /tmp/feature-url)" -o /tmp/kwai/feature.apk; fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          cat > /tmp/run-kwai-remote.sh <<'SH'
          set -euo pipefail
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; do sleep 2; done

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/kwai/base.apk >/tmp/kwai-cert.txt 2>&1
          grep -qi 'bb8d2610b048bee8e9f96cd5456d8b8b5a0806d2a41dffdf744d2a8720e81047' /tmp/kwai-cert.txt

          APKS=(/tmp/kwai/base.apk /tmp/kwai/config.arm64_v8a.apk /tmp/kwai/config.density.apk)
          [ -f /tmp/kwai/feature.apk ] && APKS+=(/tmp/kwai/feature.apk)
          adb install-multiple -r "${APKS[@]}"
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true

          # Navigate automatically only to the already-proven Google authentication surface.
          set +e
          python3 scripts/kwai_google_login_probe.py
          PROBE_RC=$?
          set -e
          echo "google_surface_probe_rc=$PROBE_RC"
          echo 'REMOTE_LOGIN_READY'
          echo 'Use the protected noVNC URL from the job summary to complete Google sign-in yourself.'

          # Wait for the user to finish Google sign-in. Never type or capture credentials here.
          GOOGLE_ACCOUNT=false
          KWAI_RETURNED=false
          for _ in $(seq 1 120); do
            ACCOUNTS="$(adb shell dumpsys account 2>/dev/null || true)"
            TOP="$(adb shell dumpsys activity activities 2>/dev/null || true)"
            if printf '%s' "$ACCOUNTS" | grep -qi 'com.google'; then GOOGLE_ACCOUNT=true; fi
            if [ "$GOOGLE_ACCOUNT" = true ] && printf '%s' "$TOP" | grep -q 'com.kwai.video' && ! printf '%s' "$TOP" | grep -q 'TinyGoogleSSOActivity'; then
              KWAI_RETURNED=true
              break
            fi
            sleep 10
          done

          {
            echo "google_account_present=$GOOGLE_ACCOUNT"
            echo "kwai_returned_after_google=$KWAI_RETURNED"
          } >/tmp/kwai-remote-result.txt

          if [ "$GOOGLE_ACCOUNT" != true ] || [ "$KWAI_RETURNED" != true ]; then
            exit 2
          fi
          SH
          chmod +x /tmp/run-kwai-remote.sh

      - name: Boot Android 14 and hold protected login session
        if: steps.access.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on -no-metrics
          script: bash /tmp/run-kwai-remote.sh

      - name: Sanitized result
        if: always() && steps.access.outputs.configured == 'true'
        shell: bash
        run: |
          {
            echo '## Kwai Google remote-login result'
            echo
            cat /tmp/kwai-remote-result.txt 2>/dev/null || echo 'login_result=not_completed'
            echo
            echo 'No Google password, OTP, token, account database, screenshot after login, or authenticated app data is uploaded as an artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
