name: Apply v9 delete and dedupe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v9_delete_and_dedupe.py'
      - '.github/workflows/apply-v9-delete-dedupe.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v9 patch
        run: python scripts/patch_v9_delete_and_dedupe.py

      - name: Commit v9 changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-app/src/main/java/com/luizcalori/kwaihelper/MainActivity.java mobile-app/build.gradle
          if git diff --cached --quiet; then
            echo 'No v9 changes to commit.'
          else
            git commit -m 'Delete published videos and persist dedupe history'
            git push
          fi

      - name: Install Android SDK 35
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kwai-phone-helper-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Build v9 debug APK
        run: gradle --no-daemon :mobile-app:assembleDebug

      - name: Upload v9 APK
        uses: actions/upload-artifact@v4
        with:
          name: kwai-phone-helper-v9
          path: mobile-app/build/outputs/apk/debug/mobile-app-debug.apk
          if-no-files-found: error
          retention-days: 7
