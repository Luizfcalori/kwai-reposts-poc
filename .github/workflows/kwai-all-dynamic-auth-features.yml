name: Kwai all dynamic auth features

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kwai-all-dynamic-auth-features.yml'

permissions:
  contents: read

jobs:
  scan-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download metadata and every dynamic feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/features /tmp/decompiled
          API='https://ws75.aptoide.com/api/7/app/get/package_name=com.kwai.video/nodes=meta,versions/aab=1/language=pt_PT/country=br'
          curl -LsS --retry 4 --retry-delay 2 "$API" -o /tmp/meta.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/meta.json',encoding='utf-8'))
          m=((d.get('nodes') or {}).get('meta') or {}).get('data') or {}
          f=m.get('file') or {}
          md5=f.get('md5sum') or ''
          if not md5: raise SystemExit('missing md5')
          pathlib.Path('/tmp/md5').write_text(md5)
          pathlib.Path('artifacts/version.txt').write_text(
              f"version={f.get('vername')}\nversionCode={f.get('vercode')}\nmd5={md5}\n",
              encoding='utf-8')
          PY

          curl -LsS --retry 4 --retry-delay 2 \
            "https://ws75.aptoide.com/api/7/app/getDynamicSplits/apk_md5sum=$(cat /tmp/md5)/language=pt_PT" \
            -o /tmp/dynamic.json
          cp /tmp/dynamic.json artifacts/dynamic.json

          python3 - <<'PY'
          import json,pathlib,re
          d=json.load(open('/tmp/dynamic.json',encoding='utf-8'))
          rows=[]
          with open('/tmp/features.tsv','w',encoding='utf-8') as out:
              for i,x in enumerate(d.get('list') or []):
                  if not isinstance(x,dict): continue
                  typ=str(x.get('type') or '')
                  name=str(x.get('name') or x.get('id') or f'feature{i}')
                  path=x.get('path') or ''
                  rows.append({k:x.get(k) for k in ('name','type','md5sum','filesize','path') if x.get(k) is not None})
                  if typ.upper()=='FEATURE' and isinstance(path,str) and path.startswith('http'):
                      safe=re.sub(r'[^A-Za-z0-9_.-]+','_',name)[:100]
                      out.write(f'{i}\t{safe}\t{path}\n')
          pathlib.Path('artifacts/dynamic-inventory.txt').write_text('\n'.join(map(str,rows))+'\n',encoding='utf-8')
          PY

          while IFS=$'\t' read -r idx name url; do
            [ -n "$url" ] || continue
            echo "Downloading FEATURE $idx $name"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "/tmp/features/${idx}-${name}.apk" || true
          done < /tmp/features.tsv

          find /tmp/features -type f -name '*.apk' -printf '%f %s bytes\n' | sort > artifacts/downloaded-features.txt

      - name: Scan every feature for phone-login implementation
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BT/aapt"
          : > artifacts/auth-feature-manifest-hits.txt
          : > artifacts/auth-feature-dex-hits.txt
          : > artifacts/matching-features.txt
          : > artifacts/strong-matching-features.txt

          PAT='PhoneAccountActivityV2|PhoneAccountActivity|PhoneVerifyActivity|ForcePhoneRegisterActivity|CommonLoginActivity|AutoLoginActivity|TinyLoginActivity|TinyLoginPluginImpl|ITinyLoginPlugin|arg_tiny_login_source|BindPhoneActivity|ChangePhoneActivity|PhoneResetPsdActivity|VerifyPhoneActivity|PHONE_NUMBER_LOGIN_PAGE|PHONE_LOGIN_NEW|CLICK_PHONE_LOGIN|INPUT_PHONE_NUMBER_IN_LOGIN_PROCESS|UNIFIED_SIGNUP_LOGIN|FORCE_SIGNUP_LOGIN|phone.?login|login.?phone|userlogin'
          STRONG='PhoneAccountActivityV2|PhoneAccountActivity|PhoneVerifyActivity|ForcePhoneRegisterActivity|CommonLoginActivity|AutoLoginActivity|TinyLoginActivity|TinyLoginPluginImpl|ITinyLoginPlugin|arg_tiny_login_source|userlogin|PHONE_NUMBER_LOGIN_PAGE|CLICK_PHONE_LOGIN'

          for apk in /tmp/features/*.apk; do
            [ -f "$apk" ] || continue
            b="$(basename "$apk")"
            hit=0
            strong=0

            if "$AAPT" dump xmltree "$apk" AndroidManifest.xml > /tmp/manifest.txt 2>/dev/null; then
              mh="$(grep -Ei -C 6 "$PAT" /tmp/manifest.txt || true)"
              if [ -n "$mh" ]; then
                hit=1
                { echo "===== $b ====="; echo "$mh"; } >> artifacts/auth-feature-manifest-hits.txt
              fi
              if grep -Eiq "$STRONG" /tmp/manifest.txt; then strong=1; fi
            fi

            tmp="$(mktemp -d)"
            unzip -qq "$apk" 'classes*.dex' -d "$tmp" 2>/dev/null || true
            for dex in "$tmp"/classes*.dex; do
              [ -f "$dex" ] || continue
              dh="$(strings -a "$dex" | grep -Ei "$PAT" | sort -u || true)"
              if [ -n "$dh" ]; then
                hit=1
                { echo "===== $b :: $(basename "$dex") ====="; echo "$dh"; } >> artifacts/auth-feature-dex-hits.txt
              fi
              if strings -a "$dex" | grep -Eiq "$STRONG"; then strong=1; fi
            done
            rm -rf "$tmp"

            [ "$hit" -eq 1 ] && echo "/tmp/features/$b" >> artifacts/matching-features.txt
            [ "$strong" -eq 1 ] && echo "/tmp/features/$b" >> artifacts/strong-matching-features.txt
          done

          echo '--- matching feature APKs ---'
          cat artifacts/matching-features.txt || true
          echo '--- strong matching feature APKs ---'
          cat artifacts/strong-matching-features.txt || true
          echo '--- manifest auth hits ---'
          head -n 1000 artifacts/auth-feature-manifest-hits.txt || true
          echo '--- dex auth hits ---'
          head -n 1600 artifacts/auth-feature-dex-hits.txt || true

      - name: Install JADX and decompile strong auth features
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip' \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version | tee artifacts/jadx-version.txt

          : > artifacts/decompiled-feature-map.txt
          : > artifacts/phone-login-code-trace.txt
          : > artifacts/phone-login-route-literals.txt
          : > artifacts/tiny-login-callers.txt

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          strong=Path('artifacts/strong-matching-features.txt')
          apks=[Path(x.strip()) for x in strong.read_text(errors='ignore').splitlines() if x.strip()] if strong.exists() else []
          if not apks:
              apks=[Path(x.strip()) for x in Path('artifacts/matching-features.txt').read_text(errors='ignore').splitlines() if x.strip()][:8]

          needles=[
              'PhoneAccountActivityV2','PhoneAccountActivity','PhoneVerifyActivity','ForcePhoneRegisterActivity',
              'CommonLoginActivity','AutoLoginActivity','TinyLoginActivity','TinyLoginPluginImpl','ITinyLoginPlugin',
              'arg_tiny_login_source','PHONE_NUMBER_LOGIN_PAGE','PHONE_LOGIN_NEW','CLICK_PHONE_LOGIN',
              'INPUT_PHONE_NUMBER_IN_LOGIN_PROCESS','UNIFIED_SIGNUP_LOGIN','FORCE_SIGNUP_LOGIN',
              'SIGNUP_PHONE','PURE_PHONE_QUICK_LOGIN','userlogin','phoneLogin','phone_login','mobileLogin'
          ]
          route_rx=re.compile(r'"([^"\\]*(?:ikwai|kwai|login|phone|signup|auth|account)[^"\\]*)"',re.I)
          code=[]; uris=[]; callers=[]; fmap=[]

          for idx,apk in enumerate(apks[:12],1):
              out=Path(f'/tmp/decompiled/feature-{idx}')
              out.mkdir(parents=True,exist_ok=True)
              proc=subprocess.run(['/tmp/jadx/bin/jadx','--no-res','--show-bad-code','--deobf','-d',str(out),str(apk)],
                                  text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              fmap.append(f'{idx}\t{apk}\trc={proc.returncode}')
              src=out/'sources'
              if not src.exists():
                  continue
              for p in src.rglob('*.java'):
                  try: s=p.read_text(errors='ignore')
                  except Exception: continue
                  found=[n for n in needles if n in s]
                  if not found: continue
                  rel=f'{apk.name}::{p.relative_to(src)}'
                  lines=s.splitlines()
                  idxs=[i for i,l in enumerate(lines) if any(n in l for n in found)]
                  code.append(f'===== {rel} | {found} =====')
                  ranges=[]
                  for i in idxs:
                      a=max(0,i-24); b=min(len(lines),i+45)
                      if ranges and a<=ranges[-1][1]+4:
                          ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                      else:
                          ranges.append((a,b))
                  for a,b in ranges:
                      for j in range(a,b): code.append(f'{j+1}: {lines[j]}')
                      code.append('---')

                  if 'ITinyLoginPlugin' in s or 'arg_tiny_login_source' in s or 'TinyLoginPluginImpl' in s:
                      callers.append(f'===== {rel} =====')
                      for i,l in enumerate(lines):
                          if ('ITinyLoginPlugin' in l or 'arg_tiny_login_source' in l or 'TinyLoginPluginImpl' in l or
                              re.search(r'\.login\s*\(',l)):
                              a=max(0,i-12); b=min(len(lines),i+24)
                              for j in range(a,b): callers.append(f'{j+1}: {lines[j]}')
                              callers.append('---')

                  for m in route_rx.finditer(s):
                      val=m.group(1)
                      if len(val)<260:
                          uris.append(f'{rel}: {val}')

          Path('artifacts/decompiled-feature-map.txt').write_text('\n'.join(fmap)+'\n',encoding='utf-8')
          Path('artifacts/phone-login-code-trace.txt').write_text('\n'.join(code),encoding='utf-8')
          Path('artifacts/phone-login-route-literals.txt').write_text('\n'.join(dict.fromkeys(uris)),encoding='utf-8')
          Path('artifacts/tiny-login-callers.txt').write_text('\n'.join(callers),encoding='utf-8')
          print('candidate_apks=',len(apks))
          print('trace_lines=',len(code))
          print('caller_lines=',len(callers))
          print('route_literals=',len(uris))
          PY

          echo '--- decompiled feature map ---'
          cat artifacts/decompiled-feature-map.txt || true
          echo '--- strongest phone login code ---'
          grep -Eai -C 12 'PhoneAccountActivity|PhoneVerifyActivity|ForcePhoneRegisterActivity|AutoLoginActivity|TinyLoginActivity|arg_tiny_login_source|PHONE_NUMBER_LOGIN_PAGE|CLICK_PHONE_LOGIN|UNIFIED_SIGNUP_LOGIN|userlogin' artifacts/phone-login-code-trace.txt | head -n 2200 || true
          echo '--- Tiny login callers ---'
          head -n 1800 artifacts/tiny-login-callers.txt || true
          echo '--- route literals ---'
          grep -Eai 'ikwai|kwai|login|phone|signup|auth|account' artifacts/phone-login-route-literals.txt | head -n 1200 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwai-all-dynamic-auth-features-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
