name: Patch Kwai navigation controls

on:
  push:
    paths:
      - '.github/workflows/patch-kwai-nav-controls.yml'
      - 'scripts/patch_kwai_nav_controls.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Patch control transport to top-level GET navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_kwai_nav_controls.py
          python3 -m py_compile scripts/kwai_phone_remote.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/kwai_phone_remote.py
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Use top-level navigation for protected Kwai controls'
          git push
