name: Scan Kwai sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - 'config/kwai_sources.json'
      - 'scripts/scan_kwai_sources.py'
      - 'scripts/improve_kwai_captions.py'
      - '.github/workflows/scan-kwai-sources.yml'

permissions:
  contents: write

concurrency:
  group: kwai-source-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check selenium==4.36.0

      - name: Scan configured Kwai sources
        run: python scripts/scan_kwai_sources.py

      - name: Improve captions and hashtags
        run: python scripts/improve_kwai_captions.py

      - name: Persist newly detected videos
        shell: bash
        run: |
          if git diff --quiet -- data/kwai_queue.json; then
            echo 'No Kwai queue changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kwai_queue.json
          git commit -m 'Update Kwai discovery queue'
          git pull --rebase origin main
          git push origin HEAD:main
