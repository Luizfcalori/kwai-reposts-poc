name: Build v15 direct Kwai share

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v15-direct-kwai.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch direct Kwai share behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile-app/src/main/java/com/luizcalori/kwaihelper/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('title.setText("Kwai Phone Helper v14");', 'title.setText("Kwai Phone Helper v15");')

          chooser_line = '            startActivity(Intent.createChooser(share, "Escolha o Kwai"));'
          direct_lines = (
              '            final String kwaiPackage = "com.kwai.video";\n'
              '            grantUriPermission(kwaiPackage, videoUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);\n'
              '            share.setPackage(kwaiPackage);\n'
              '            startActivity(share);'
          )
          if chooser_line not in text:
              raise SystemExit('chooser call not found; refusing to build an unpatched APK')
          text = text.replace(chooser_line, direct_lines, 1)
          text = text.replace(
              '            setStatus("Vídeo enviado. A legenda está copiada — cole no campo de descrição do Kwai.");',
              '            setStatus("Abrindo direto no Kwai. A legenda está copiada — cole no campo de descrição.");',
              1,
          )
          text = text.replace(
              '            setChip("ENVIADO AO KWAI • TEXTO COPIADO");',
              '            setChip("ABERTO DIRETO NO KWAI • TEXTO COPIADO");',
              1,
          )

          old_catch = (
              '        } catch (ActivityNotFoundException ex) {\n'
              '            Toast.makeText(this, "Nenhum aplicativo compatível foi encontrado.", Toast.LENGTH_LONG).show();\n'
              '        }\n'
              '    }\n\n'
              '    private void markPostedAndDelete() {'
          )
          new_catch = (
              '        } catch (ActivityNotFoundException | SecurityException ex) {\n'
              '            try {\n'
              '                share.setPackage(null);\n'
              '                startActivity(Intent.createChooser(share, "Escolha o Kwai"));\n'
              '                setStatus("Não consegui abrir o Kwai diretamente. Use o seletor desta vez.");\n'
              '                setChip("SELETOR DE COMPARTILHAMENTO");\n'
              '            } catch (ActivityNotFoundException fallbackEx) {\n'
              '                Toast.makeText(this, "Nenhum aplicativo compatível foi encontrado.", Toast.LENGTH_LONG).show();\n'
              '            }\n'
              '        }\n'
              '    }\n\n'
              '    private void markPostedAndDelete() {'
          )
          if old_catch not in text:
              raise SystemExit('shareCurrent catch block not found; refusing to build an unpatched APK')
          text = text.replace(old_catch, new_catch, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore permanent Kwai signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kwai-phone-helper-debug-keystore-v1

      - name: Pin signing key into project build
        shell: bash
        run: |
          test -f ~/.android/debug.keystore
          mkdir -p mobile-app/signing
          cp ~/.android/debug.keystore mobile-app/signing/kwai-helper.keystore

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Build v15 APK
        run: gradle --no-daemon :mobile-app:assembleDebug

      - name: Verify APK certificate
        shell: bash
        run: |
          APK=mobile-app/build/outputs/apk/debug/mobile-app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Publish latest APK metadata
        shell: bash
        run: |
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode ' mobile-app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName ' mobile-app/build.gradle | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          mkdir -p releases
          cp mobile-app/build/outputs/apk/debug/mobile-app-debug.apk releases/kwai-phone-helper-latest.apk
          SHA=$(sha256sum releases/kwai-phone-helper-latest.apk | awk '{print $1}')
          cat > releases/latest.json <<EOF
          {
            "version_code": $VERSION_CODE,
            "version_name": "$VERSION_NAME",
            "apk_url": "https://raw.githubusercontent.com/Luizfcalori/kwai-reposts-poc/main/releases/kwai-phone-helper-latest.apk",
            "sha256": "$SHA"
          }
          EOF
          git restore -- mobile-app/src/main/java/com/luizcalori/kwaihelper/MainActivity.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f releases/kwai-phone-helper-latest.apk releases/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Kwai Phone Helper v${VERSION_CODE}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload v15 APK
        uses: actions/upload-artifact@v4
        with:
          name: kwai-phone-helper-v15
          path: mobile-app/build/outputs/apk/debug/mobile-app-debug.apk
          retention-days: 7
