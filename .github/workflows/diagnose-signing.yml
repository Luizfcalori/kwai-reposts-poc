name: Diagnose signing key

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-signing.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore cached debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kwai-phone-helper-debug-keystore-v1
      - name: Print cached keystore fingerprint
        shell: bash
        run: |
          test -f ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256|Owner|Valid from' || true
